name: Build apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Embed API key
        shell: bash
        env:
          FD_KEY: ${{ secrets.FD_KEY }}
        run: node -e 'require("fs").writeFileSync("config.json",JSON.stringify({key:process.env.FD_KEY||""}))'
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
